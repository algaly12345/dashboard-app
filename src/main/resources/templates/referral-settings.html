<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/head :: head('إعدادات الإحالة')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('referrals')}"></div>

    <div class="main-col">
        <div th:replace="~{fragments/topbar :: topbar(#{app.name}, 'إعدادات الإحالة')}"></div>

        <div class="content">

            <a th:href="@{/referrals}" class="btn btn-outline-gold mb-3">
                <i class="bi bi-arrow-right"></i> رجوع للإحالات
            </a>

            <div th:if="${saved}" class="alert alert-success py-2 px-3 mb-3 small">تم الحفظ بنجاح</div>

            <form th:action="@{/referrals/settings}" method="post">
                <div class="form-section" style="max-width:640px;">
                    <div class="form-section-title"><i class="bi bi-gift"></i> إعدادات برنامج الإحالة</div>

                    <div class="mb-3">
                        <label class="form-label">نوع المكافأة</label>
                        <select name="rewardType" class="form-select">
                            <option value="PERCENTAGE" th:selected="${settings.rewardType.name() == 'PERCENTAGE'}">نسبة مئوية</option>
                            <option value="FIXED" th:selected="${settings.rewardType.name() == 'FIXED'}">مبلغ ثابت</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">قيمة المكافأة</label>
                        <input type="number" step="0.01" name="rewardValue" th:value="${settings.rewardValue}" class="form-control" required/>
                        <div class="form-text">نسبة مئوية أو مبلغ ثابت حسب النوع المختار أعلاه</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">مهلة دفع المكافأة بعد التسجيل (بالأيام)</label>
                        <input type="number" name="attributionWindowDays" th:value="${settings.attributionWindowDays}" class="form-control" required/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">أدنى مبلغ لطلب سحب</label>
                        <input type="number" step="0.01" name="minPayoutLimit" th:value="${settings.minPayoutLimit}" class="form-control" required/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">أيام التعليق قبل الاعتماد التلقائي</label>
                        <input type="number" name="commissionHoldDays" th:value="${settings.commissionHoldDays}" class="form-control"/>
                        <div class="form-text">اتركه فاضي لتعطيل الاعتماد التلقائي</div>
                    </div>
                </div>

                <div class="sticky-save-bar" style="max-width:640px;">
                    <a th:href="@{/referrals}" class="btn btn-outline-gold">إلغاء</a>
                    <button type="submit" class="btn btn-gold"><i class="bi bi-check2"></i> حفظ الإعدادات</button>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
