<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/head :: head(${#messages.msg('nav.categories')})}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('categories')}"></div>

    <div class="main-col">
        <div th:replace="~{fragments/topbar :: topbar(#{app.name}, #{nav.categories})}"></div>

        <div class="content">
            <div class="offer-grid">
                <div class="offer-card" th:each="c : ${categories}">
                    <div class="offer-card-media">
                        <img th:if="${c.image}" th:src="${@imageUrlService.categoryImage(c.image)}" onerror="this.style.display='none'"/>
                        <i th:unless="${c.image}" class="bi bi-tags placeholder-icon"></i>
                        <span class="offer-card-status">
                            <span th:if="${c.statusHome != null and c.statusHome.name() == 'active'}" class="badge-pill badge-active" th:text="#{estate.active}">Active</span>
                            <span th:if="${c.statusHome == null or c.statusHome.name() == 'disactive'}" class="badge-pill badge-disactive" th:text="#{estate.disactive}">Inactive</span>
                        </span>
                    </div>
                    <div class="offer-card-body">
                        <div class="offer-card-title" th:text="${c.nameAr}">Name</div>
                        <div class="offer-card-desc" th:text="${c.name}">Name EN</div>
                    </div>
                    <div class="offer-card-footer">
                        <code class="small" th:text="${c.slug}">slug</code>
                        <a th:href="@{'/categories/' + ${c.id} + '/edit'}" class="btn-icon" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
