<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/head :: head(${#messages.msg('banner.createTitle')})}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('banners')}"></div>

    <div class="main-col">
        <div th:replace="~{fragments/topbar :: topbar(#{app.name}, #{banner.createTitle})}"></div>

        <div class="content">

            <a th:href="@{/banners}" class="btn btn-outline-gold mb-3">
                <i class="bi bi-arrow-right"></i> <span th:text="#{estate.backToList}">Back</span>
            </a>

            <form th:action="@{/banners}" method="post">
                <div class="form-section">
                    <div class="form-section-title"><i class="bi bi-image"></i> <span th:text="#{banner.createTitle}">New banner</span></div>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label" th:text="#{banner.title}">Title</label>
                            <input type="text" name="title" class="form-control" required/>
                        </div>
                        <div class="col-12">
                            <label class="form-label" th:text="#{banner.description}">Description</label>
                            <textarea name="description" rows="3" class="form-control"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" th:text="#{banner.zone}">Zone</label>
                            <select name="zoneId" class="form-select">
                                <option value="" th:text="#{banner.allZones}">All zones</option>
                                <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.nameAr}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" th:text="#{banner.provider}">Provider</label>
                            <select name="providerId" class="form-select">
                                <option value="" th:text="#{banner.noProvider}">No provider</option>
                                <option th:each="p : ${providerOptions}" th:value="${p.value}" th:text="${p.label}"></option>
                            </select>
                        </div>
                        <div class="col-12 form-check form-switch">
                            <input type="checkbox" name="status" checked class="form-check-input" id="bannerStatus"/>
                            <label class="form-check-label" for="bannerStatus" th:text="#{banner.status}">Active</label>
                        </div>
                    </div>
                </div>

                <div class="sticky-save-bar">
                    <button type="submit" class="btn btn-gold"><i class="bi bi-check2"></i> <span th:text="#{banner.createSave}">Create</span></button>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
