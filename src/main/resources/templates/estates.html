<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/head :: head(${#messages.msg('nav.estates')})}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('estates')}"></div>

    <div class="main-col">
        <div th:replace="~{fragments/topbar :: topbar(#{app.name}, #{nav.estates})}"></div>

        <div class="content">

            <div th:if="${expiredOnly}" class="alert py-2 px-3 mb-3 small d-flex align-items-center justify-content-between" style="background: var(--danger-bg); color: var(--danger); border-color: var(--danger);">
                <span><i class="bi bi-exclamation-triangle"></i> <span th:text="#{estate.expiredFilterActive}">Showing expired licenses only</span></span>
                <a th:href="@{/estates}" class="fw-semibold" style="color: var(--danger);" th:text="#{estate.clearFilter}">Clear</a>
            </div>

            <!-- Filters + Add button, same row -->
            <form th:action="@{/estates}" method="get" class="card section-card mb-3">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <div class="fw-bold"><i class="bi bi-funnel"></i> <span th:text="#{estate.filter.apply}">Filter</span></div>
                    <a th:href="@{/estates/new}" class="btn btn-gold btn-sm">
                        <i class="bi bi-plus-lg"></i> إضافة عقار (NHC)
                    </a>
                </div>

                <div class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label" th:text="#{estate.title}">Search</label>
                        <input type="text" name="q" th:value="${q}" class="form-control" th:placeholder="#{estate.search.placeholder}"/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" th:text="#{estate.city}">City</label>
                        <select name="city" class="form-select">
                            <option value="" th:text="#{estate.filter.city}">All cities</option>
                            <option th:each="c : ${cities}" th:value="${c}" th:text="${c}" th:selected="${c == city}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" th:text="#{estate.type}">Category</label>
                        <select name="category" class="form-select">
                            <option value="" th:text="#{estate.filter.category}">All categories</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" th:text="#{estate.status}">Status</label>
                        <select name="status" class="form-select">
                            <option value="" th:text="#{estate.filter.status}">All statuses</option>
                            <option value="active" th:text="#{estate.active}" th:selected="${status == 'active'}"></option>
                            <option value="disactive" th:text="#{estate.disactive}" th:selected="${status == 'disactive'}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" th:text="#{estate.adType}">Purpose</label>
                        <select name="adType" class="form-select">
                            <option value="" th:text="#{estate.filter.adType}">All purposes</option>
                            <option value="بيع" th:text="#{estate.sale}" th:selected="${adType == 'بيع'}"></option>
                            <option value="إيجار" th:text="#{estate.rent}" th:selected="${adType == 'إيجار'}"></option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-outline-gold w-100" th:text="#{estate.filter.apply}">Filter</button>
                    </div>
                </div>

                <div class="row g-2 align-items-end mt-1">
                    <div class="col-md-2">
                        <label class="form-label" th:text="#{estate.type}">Estate type</label>
                        <select name="estateType" class="form-select">
                            <option value="" th:text="#{estate.filter.estateType}">All estate types</option>
                            <option th:each="t : ${estateTypes}" th:value="${t}" th:text="${t}" th:selected="${t == estateType}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" th:text="#{estate.filter.virtualTour}">Virtual tour</label>
                        <select name="virtualTour" class="form-select">
                            <option value="" th:text="#{estate.virtualTour.any}">Any</option>
                            <option value="yes" th:text="#{estate.virtualTour.yes}" th:selected="${virtualTour == 'yes'}"></option>
                            <option value="no" th:text="#{estate.virtualTour.no}" th:selected="${virtualTour == 'no'}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" th:text="#{estate.minPrice}">Min price</label>
                        <input type="number" name="minPrice" th:value="${minPrice}" class="form-control" placeholder="0"/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" th:text="#{estate.maxPrice}">Max price</label>
                        <input type="number" name="maxPrice" th:value="${maxPrice}" class="form-control" placeholder="—"/>
                    </div>
                    <div class="col-md-4 text-end">
                        <a th:href="@{/estates/map}" class="btn btn-outline-gold btn-sm">
                            <i class="bi bi-geo-alt"></i> <span th:text="#{estate.mapView}">Map view</span>
                        </a>
                    </div>
                </div>
            </form>

            <div class="card table-card">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th th:text="#{estate.title}">Title</th>
                        <th>المعلن</th>
                        <th th:text="#{estate.city}">City</th>
                        <th th:text="#{estate.district}">District</th>
                        <th th:text="#{estate.adType}">Purpose</th>
                        <th th:text="#{estate.price}">Price</th>
                        <th th:text="#{estate.views}">Views</th>
                        <th th:text="#{estate.status}">Status</th>
                        <th th:if="${not expiredOnly}" th:text="#{estate.date}">Date</th>
                        <th th:if="${expiredOnly}" th:text="#{estate.endDate}" style="color: var(--danger);">Expired</th>
                        <th th:text="#{estate.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="e : ${estates.content}">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img th:if="${e.firstImage}" th:src="${@imageUrlService.estateImage(e.firstImage)}" class="thumb" onerror="this.style.display='none'"/>
                                <div th:unless="${e.firstImage}" class="thumb-fallback"><i class="bi bi-image"></i></div>
                                <div>
                                    <div th:text="${e.shortDescription}">Title</div>
                                    <span th:if="${e.hasVirtualTour}" class="badge-pill badge-tour mt-1">
                                        <i class="bi bi-box"></i> <span th:text="#{estate.virtualTour.badge}">3D tour</span>
                                    </span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <button type="button" th:if="${e.userId != null and estateUsers.get(e.userId) != null}"
                                    class="advertiser-chip" th:onclick="'showAdvertiser(' + ${e.userId} + ', ' + ${e.id} + ')'">
                                <img th:if="${estateUsers.get(e.userId).imageUrl}" th:src="${estateUsers.get(e.userId).imageUrl}"
                                     onerror="this.style.display='none'"/>
                                <i th:unless="${estateUsers.get(e.userId).imageUrl}" class="bi bi-person-circle"></i>
                                <span th:text="${estateUsers.get(e.userId).name}">Name</span>
                            </button>
                            <span th:unless="${e.userId != null and estateUsers.get(e.userId) != null}" class="text-muted small">—</span>
                        </td>
                        <td th:text="${e.city}">City</td>
                        <td th:text="${e.districts}">District</td>
                        <td>
                            <span th:if="${e.advertisementType == 'بيع'}" class="badge-pill badge-sale" th:text="#{estate.sale}">Sale</span>
                            <span th:if="${e.advertisementType == 'إيجار'}" class="badge-pill badge-rent" th:text="#{estate.rent}">Rent</span>
                        </td>
                        <td th:text="|${e.price} #{estate.currency}|">0</td>
                        <td th:text="${e.view}">0</td>
                        <td>
                            <span th:if="${e.status.name() == 'active'}" class="badge-pill badge-active" th:text="#{estate.active}">Active</span>
                            <span th:if="${e.status.name() == 'disactive'}" class="badge-pill badge-disactive" th:text="#{estate.disactive}">Inactive</span>
                        </td>
                        <td th:if="${not expiredOnly}" th:text="${#temporals.format(e.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
                        <td th:if="${expiredOnly}" style="color: var(--danger); font-weight:700;" th:text="${e.endDate}">01/01/2025</td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{'/estates/' + ${e.id}}" class="btn-icon" title="View">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{'/estates/' + ${e.id} + '/photos'}" class="btn-icon" title="Photos">
                                    <i class="bi bi-images"></i>
                                </a>
                                <a th:href="@{'/estates/' + ${e.id} + '/edit'}" class="btn-icon" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${estates.content.isEmpty()}">
                        <td colspan="10" class="text-center text-muted py-4" th:text="#{estate.noResults}">No results</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav th:if="${estates.totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
                <span class="text-muted small">
                    <span th:text="#{common.page}">Page</span>
                    <span th:text="${estates.number + 1}">1</span>
                    <span th:text="#{common.of}">of</span>
                    <span th:text="${estates.totalPages}">1</span>
                </span>
                <div class="btn-group">
                    <a class="btn btn-outline-secondary btn-sm"
                       th:classappend="${estates.first} ? 'disabled' : ''"
                       th:href="@{/estates(q=${q}, city=${city}, category=${category}, status=${status}, adType=${adType}, estateType=${estateType}, virtualTour=${virtualTour}, minPrice=${minPrice}, maxPrice=${maxPrice}, licenseExpired=${licenseExpired}, zoneId=${zoneId}, page=${estates.number - 1})}"
                       th:text="#{common.prev}">Prev</a>
                    <a class="btn btn-outline-secondary btn-sm"
                       th:classappend="${estates.last} ? 'disabled' : ''"
                       th:href="@{/estates(q=${q}, city=${city}, category=${category}, status=${status}, adType=${adType}, estateType=${estateType}, virtualTour=${virtualTour}, minPrice=${minPrice}, maxPrice=${maxPrice}, licenseExpired=${licenseExpired}, zoneId=${zoneId}, page=${estates.number + 1})}"
                       th:text="#{common.next}">Next</a>
                </div>
            </nav>

            <!-- Advertiser details modal -->
            <div id="advertiserModalBackdrop" class="advertiser-modal-backdrop" onclick="hideAdvertiser(event)">
                <div class="advertiser-modal" onclick="event.stopPropagation()">
                    <button type="button" class="advertiser-modal-close" onclick="hideAdvertiser()"><i class="bi bi-x-lg"></i></button>
                    <div id="advertiserModalBody"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var ESTATE_USERS = /*[[${estateUsers}]]*/ {};
    /*]]>*/

    function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s || '';
        return div.innerHTML;
    }

    function socialRow(icon, label, value) {
        if (!value) return '';
        return '<a href="' + escapeHtml(value) + '" target="_blank" class="advertiser-social-row">' +
               '<i class="bi ' + icon + '"></i> ' + label + '</a>';
    }

    function showAdvertiser(userId, estateId) {
        var u = ESTATE_USERS[userId];
        if (!u) return;

        var imgHtml = u.imageUrl
            ? '<img src="' + escapeHtml(u.imageUrl) + '" class="advertiser-modal-photo"/>'
            : '<div class="advertiser-modal-photo advertiser-modal-photo-fallback"><i class="bi bi-person"></i></div>';

        var html = '' +
            '<div class="advertiser-modal-hero">' +
                imgHtml +
                '<div class="fw-bold fs-5 mt-2">' + escapeHtml(u.name) + '</div>' +
                '<div class="text-muted small" dir="ltr">' + escapeHtml(u.phone) + '</div>' +
            '</div>' +

            '<div class="advertiser-stat-card">' +
                '<div class="advertiser-stat-icon"><i class="bi bi-houses"></i></div>' +
                '<div>' +
                    '<div class="advertiser-stat-value">' + u.estateCount + '</div>' +
                    '<div class="advertiser-stat-label">عدد العقارات المضافة</div>' +
                '</div>' +
            '</div>' +

            '<div class="advertiser-detail-grid">' +
                (u.email ? '<div><span class="text-muted small">البريد الإلكتروني</span><div class="fw-bold">' + escapeHtml(u.email) + '</div></div>' : '') +
                (u.unifiedNumber ? '<div><span class="text-muted small">الرقم الموحد</span><div class="fw-bold" dir="ltr">' + escapeHtml(u.unifiedNumber) + '</div></div>' : '') +
                (u.advertiserNo ? '<div><span class="text-muted small">رقم المعلن</span><div class="fw-bold" dir="ltr">' + escapeHtml(String(u.advertiserNo)) + '</div></div>' : '') +
                (u.falLicenseNumber ? '<div><span class="text-muted small">رخصة فال</span><div class="fw-bold" dir="ltr">' + escapeHtml(u.falLicenseNumber) + '</div></div>' : '') +
            '</div>';

        var socials = socialRow('bi-youtube', 'يوتيوب', u.youtube) +
                      socialRow('bi-snapchat', 'سناب شات', u.snapchat) +
                      socialRow('bi-instagram', 'انستقرام', u.instagram) +
                      socialRow('bi-globe', 'الموقع الإلكتروني', u.website) +
                      socialRow('bi-tiktok', 'تيك توك', u.tiktok) +
                      socialRow('bi-twitter-x', 'إكس (تويتر)', u.twitter);

        if (socials) {
            html += '<hr/><div class="fw-bold small mb-2"><i class="bi bi-share"></i> روابط التواصل</div>' +
                    '<div class="advertiser-social-list">' + socials + '</div>';
        }

        html += '<a class="btn btn-gold w-100 mt-4" href="/estates/' + estateId + '/edit?previewUserId=' + userId + '">' +
                '<i class="bi bi-pencil"></i> تعديل بيانات المستخدم</a>';

        document.getElementById('advertiserModalBody').innerHTML = html;
        document.getElementById('advertiserModalBackdrop').classList.add('open');
    }

    function hideAdvertiser(e) {
        document.getElementById('advertiserModalBackdrop').classList.remove('open');
    }
</script>
</body>
</html>
